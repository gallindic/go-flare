name: binaries

on:
  workflow_dispatch:
  push:
    branches:
    tags:

jobs:
  build:
    name: Build go-flare with SLSA
    uses: ./.github/workflows/build-go-slsa3.yaml
    with:
      go_version: "${{ vars.GO_VERSION }}"
      ubuntu_version: "${{ vars.UBUNTU_VERSION }}"
      build_artifact_name: "avalanchego"

  build-verification:
    #if: github.ref_type == 'tag'
    name: Go Verification Build
    uses: ./.github/workflows/build-go-verification.yaml
    with:
      go_version: "${{ vars.GO_VERSION }}"
      ubuntu_version: "${{ vars.UBUNTU_VERSION }}"
      build_artifact_name: "avalanchego-verification"

  release:
    name: Release
    runs-on: "ubuntu-${{ vars.UBUNTU_VERSION }}"
    needs: [build, build-verification]
    #if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
    steps:
      - run: sudo apt-get update -y && sudo apt-get install -y diffoscope-minimal

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Extract avalanchego build
        run: tar -xzf artifacts/avalanchego/folder.tgz -C artifacts/avalanchego

      - name: Verify reproducible build
        run: |
          HASH_MAIN=$(sha256sum artifacts/avalanchego/binaries/avalanchego | awk '{print $1}')
          HASH_VERIFY=$(sha256sum artifacts/avalanchego-verification/avalanchego | awk '{print $1}')
          
          if [ "$HASH_MAIN" = "$HASH_VERIFY" ]; then
            echo "Hashes match - build is reproducible"
          else
            echo "Hashes don't match"

            diffoscope artifacts/avalanchego/binaries/avalanchego artifacts/avalanchego-verification/avalanchego || true
            
            exit 1
          fi

