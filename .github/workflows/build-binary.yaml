name: binaries

on:
  workflow_dispatch:
  push:
    branches:
    tags:

jobs:
  build:
    name: Build go-flare with SLSA
    uses: ./.github/workflows/builder_slsa3.yaml
    with:
      go_version: "${{ vars.GO_VERSION }}"
      ubuntu_version: "${{ vars.UBUNTU_VERSION }}"
      build_artifact_name: "avalanchego"

  #build-verify:
  #  name: Verification Build
  #  uses: ./.github/workflows/builder_slsa3.yaml
  #  with:
  #    go_version: "${{ vars.GO_VERSION }}"
  #    ubuntu_version: "${{ vars.UBUNTU_VERSION }}"

  release:
    name: Release
    runs-on: "ubuntu-${{ vars.UBUNTU_VERSION }}"
    #needs: [build, build-verify]
    needs: [build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
    steps:
      - run: sudo apt-get update -y && sudo apt-get install -y diffoscope-minimal

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Download build artifacts
        uses: slsa-framework/slsa-github-generator/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ needs.build.outputs.build-artifacts-name }}
          path: artifacts/build

      - name: Download verify artifacts
        uses: slsa-framework/slsa-github-generator/actions/secure-download-folder@v2.1.0
        with:
          name: ${{ needs.build-verify.outputs.build-artifacts-name }}
          path: artifacts/build-verify

      - name: Verify reproducible build
        run: |
          HASH_MAIN=$(sha256sum artifacts/build/avalanchego | awk '{print $1}')
          HASH_VERIFY=$(sha256sum artifacts/build-verify/avalanchego | awk '{print $1}')
          
          if [ "$HASH_MAIN" = "$HASH_VERIFY" ]; then
            echo "✓ Hashes match - build is reproducible"
          else
            echo "✗ Hashes don't match"
            diffoscope artifacts/build/avalanchego artifacts/build-verify/avalanchego || true
            exit 1
          fi

      - name: Download attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.attestations-download-name }}

      - name: Package release
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          ARTIFACT_NAME="go-flare-${RELEASE_TAG}-linux-amd64.zip"
          
          cd artifacts/build
          zip -r ../../$ARTIFACT_NAME .
          
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          body: "TODO"
          files: |
            ${{ env.ARTIFACT_NAME }}
            *.intoto.jsonl